# coturn template for the cloud sim VM (OHH-216). Placeholders only.
# TODO Varun: set the public IPv4, open the ports below, and replace the secret.
# Signaling itself stays 503 until OHH-210. TURN is the relay for when that lands.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_OHHO_TURN_SECRET
realm=REPLACE_WITH_OHHO_CLOUD_DOMAIN
# external-ip=REPLACE_WITH_PUBLIC_IPV4

min-port=49152
max-port=49252
total-quota=12
stale-nonce=600
no-multicast-peers
no-cli
no-tcp-relay
log-file=/var/log/turnserver.log
simple-log
no-stdout-log
