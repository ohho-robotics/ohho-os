name: Sim matrix

# One row per registered spec with ci_sim enabled. Adding a robot adds a row
# by registering that spec. Do not list robot ids in this file.
#
# Heavy sims (PX4 Gazebo, ArduPilot SITL, Isaac) are not jobs in this
# workflow. R-05 calls them as reusable workflows with robot: and backend:
# inputs.
#
# CPU runners. The conformance kit opens sim backends only. When a plugin
# pins meshes, they are fetched into .sim-assets/<plugin> at that commit and
# cached. They are not vendored in this repository. A failed row uploads
# conformance-logs. Headless video is not rendered.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    name: ci-sim matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.rows.outputs.matrix }}
      count: ${{ steps.rows.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Install local robot plugins
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for project in plugins/*/pyproject.toml; do
            python -m pip install -e "${project%/pyproject.toml}" --no-deps
          done
      - name: Emit ci-sim matrix
        id: rows
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(ohho list --json --ci-sim)"
          python -c 'import json,sys; json.loads(sys.argv[1])' "$matrix"
          count="$(python -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$matrix")"
          {
            echo "matrix<<EOF"
            printf '%s\n' "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

  conformance:
    name: ${{ matrix.robot }} / ${{ matrix.scenario }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Install local robot plugins
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for project in plugins/*/pyproject.toml; do
            python -m pip install -e "${project%/pyproject.toml}" --no-deps
          done
      - name: Restore plugin assets
        id: plugin-assets
        if: matrix.asset_commit != '' && matrix.asset_repository != ''
        uses: actions/cache/restore@v4
        with:
          path: .sim-assets/${{ matrix.plugin }}
          key: plugin-assets-${{ matrix.plugin }}-${{ matrix.asset_commit }}
      - name: Fetch pinned plugin assets
        if: >-
          matrix.asset_commit != '' &&
          matrix.asset_repository != '' &&
          steps.plugin-assets.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.asset_repository }}
          ref: ${{ matrix.asset_commit }}
          path: .sim-assets/${{ matrix.plugin }}
          persist-credentials: false
      - name: Materialise pinned plugin files
        if: matrix.asset_commit != '' && matrix.asset_repository != ''
        env:
          MATRIX_PLUGIN: ${{ matrix.plugin }}
        run: python -c "from ohho.plugins import materialise_ci_assets; materialise_ci_assets()"
      - name: Save plugin assets
        if: >-
          matrix.asset_commit != '' &&
          matrix.asset_repository != '' &&
          steps.plugin-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sim-assets/${{ matrix.plugin }}
          key: plugin-assets-${{ matrix.plugin }}-${{ matrix.asset_commit }}
      - name: Install sim extras
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[humanoid-sim]"
      - name: Run class conformance
        shell: bash
        env:
          MATRIX_ROBOT: ${{ matrix.robot }}
          MATRIX_CLASS: ${{ matrix.robot_class }}
          MATRIX_PLUGIN: ${{ matrix.plugin }}
          MATRIX_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          mkdir -p conformance-logs
          start=$SECONDS
          set +e
          python -m ohho.testing.conformance --robot "$MATRIX_ROBOT" \
            > "conformance-logs/${MATRIX_ROBOT}.log" 2>&1
          code=$?
          set -e
          cat "conformance-logs/${MATRIX_ROBOT}.log"
          elapsed=$((SECONDS - start))
          ELAPSED="$elapsed" python - <<'PY'
          import os
          from ohho.plugins import format_matrix_runtime

          row = {
              "robot": os.environ["MATRIX_ROBOT"],
              "robot_class": os.environ["MATRIX_CLASS"],
              "plugin": os.environ["MATRIX_PLUGIN"],
              "scenario": os.environ["MATRIX_SCENARIO"],
          }
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write(format_matrix_runtime(row, int(os.environ["ELAPSED"])))
          PY
          exit "$code"
      - name: Upload conformance log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.robot }}-${{ matrix.scenario }}
          path: conformance-logs/
          if-no-files-found: ignore
