name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate trove classifiers
        run: |
          python -m pip install trove-classifiers tomli
          python scripts/check_classifiers.py
      - name: Install
        run: python -m pip install -e .
      - name: Install humanoid sim extras (CPU)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[humanoid-sim]"
      - name: Install ohho-booster plugin
        run: python -m pip install -e plugins/ohho-booster --no-deps
      - name: Cache pinned booster assets
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/cache@v4
        with:
          path: ~/.ohho/assets/booster
          key: booster-assets-${{ hashFiles('plugins/ohho-booster/ohho_booster/assets_manifest.json') }}
      - name: Fetch pinned booster assets
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m ohho_booster.assets
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: SafetyGate coverage gate (ohho/safety.py >= 95% line+branch)
        shell: bash
        run: |
          python -m pip install "coverage>=7"
          python -m coverage run --branch --include=ohho/safety.py -m unittest tests.test_safety tests.test_humanoid_policy
          python -m coverage report -m --include=ohho/safety.py --fail-under=95
      - name: HumanoidPolicy coverage gate (ohho/humanoid_policy.py >= 95% line+branch)
        shell: bash
        run: |
          python -m coverage run --branch --include=ohho/humanoid_policy.py -m unittest tests.test_humanoid_policy
          python -m coverage report -m --include=ohho/humanoid_policy.py --fail-under=95
      - name: CLI smoke (doctor)
        run: ohho doctor
      - name: CLI smoke (sim)
        run: ohho sim --robot omnibot --seconds 2
      - name: CLI smoke (selftest sim)
        run: ohho selftest --sim
