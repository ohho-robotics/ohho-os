name: Release

# Publishes ohho-os to PyPI when a v* tag is pushed.
# workflow_dispatch builds and uploads to TestPyPI only (dry run).
# Authentication is trusted publishing only: the pypi/testpypi environment plus
# id-token: write. This file does not set a PyPI API token.
# pyproject.toml sets license = "Apache-2.0" (OHH-18).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate trove classifiers
        run: |
          python -m pip install trove-classifiers tomli
          python scripts/check_classifiers.py
      - name: Require tag version to match pyproject
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v") or len(tag) == 1:
              print(f"tag {tag!r} is not a v* version", file=sys.stderr)
              sys.exit(1)
          tag_version = tag[1:]
          project_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          print(f"tag version {tag_version}; pyproject version {project_version}")
          if tag_version != project_version:
              print(
                  f"refusing release: tag {tag_version} != pyproject {project_version}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: twine check
        run: twine check dist/*
      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  install-from-pypi:
    name: pip install on ${{ matrix.os }}
    needs: publish
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ohho-os from PyPI and run doctor
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python -m venv "${RUNNER_TEMP}/ohho-venv"
          # A new venv, not the checkout. This job does not check out the repo.
          source "${RUNNER_TEMP}/ohho-venv/bin/activate"
          python -m pip install --upgrade pip
          installed=0
          for attempt in $(seq 1 30); do
            if python -m pip install "ohho-os==${version}"; then
              installed=1
              break
            fi
            echo "attempt ${attempt}/30: ohho-os==${version} is not installable yet"
            if [ "${attempt}" -eq 30 ]; then
              echo "timed out waiting for ohho-os==${version} on PyPI"
              exit 1
            fi
            sleep 20
          done
          test "${installed}" -eq 1
          ohho doctor
