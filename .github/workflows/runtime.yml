name: runtime

on:
  push:
  pull_request:

jobs:
  test:
    name: runtime / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ohho-os and ohho-runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          python -m pip install -e ./runtime --no-deps
      - name: Runtime tests
        run: python -m pytest runtime/tests -q --tb=short
