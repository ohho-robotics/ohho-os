schema: ohho.recipe/v1
name: openvla-full
family: openvla
base_weights:
  uri: openvla/openvla-7b
dataset:
  path: datasets/vla-demos
hyperparameters:
  train_steps: 200000
  batch_size: 1
  lr: 0.0005
  precision: bf16
  gradient_checkpointing: true
  tune_mode: full
  lora_rank: 32
  lora_alpha: 16
  lora_dropout: 0.0
  lora_target_modules: all-linear
  grad_accumulation_steps: 1
  seed: 0
precision: bf16
device: cuda
compression_hooks: []
eval_hooks: []
output:
  dir: checkpoints/openvla-full
