schema: ohho.recipe/v1
name: ppo
family: ppo
dataset:
  path: datasets/sim-loop
hyperparameters:
  rollout_steps: 128
  batch_size: 32
  lr: 0.0003
  gamma: 0.99
  seed: 1
precision: fp32
device: cpu
compression_hooks: []
eval_hooks:
  - name: episode_return
    params:
      episodes: 3
output:
  dir: checkpoints/ppo
