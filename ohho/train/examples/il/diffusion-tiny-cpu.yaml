schema: ohho.recipe/v1
name: diffusion-tiny-cpu
family: diffusion
dataset:
  path: datasets/sim-loop
hyperparameters:
  train_steps: 2
  batch_size: 4
  lr: 0.0001
  chunk_size: 4
  horizon: 4
  vision_backbone: none
  diffusion_steps: 4
  scheduler: ddpm
  num_inference_steps: 2
  val_every: 1
  val_fraction: 0.2
  early_stop_patience: 0
  early_stop_min_delta: 0.0
  seed: 0
  d_model: 32
  log_every: 1
precision: fp32
device: cpu
compression_hooks: []
eval_hooks: []
output:
  dir: checkpoints/diffusion-tiny-cpu
