  nhead: 2
  num_encoder_layers: 1
  num_decoder_layers: 1
  dim_feedforward: 64
  latent_dim: 8
  kl_weight: 10.0
  log_every: 1
precision: fp32
device: cpu
compression_hooks: []
eval_hooks: []
output:
  dir: checkpoints/act-tiny-cpu
